name: quotely_flutter_app
description: "Quotely: wisdom, one message at a time."

publish_to: 'none' 

version: 2.2.0+19

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Direct dependency on purpose. Material/Cupertino are being decoupled from
  # the framework into flutter.dev packages, and material_ui declares its OWN
  # MaterialLocalizations - a different Dart type from the one in
  # package:flutter/material.dart, which flutter_localizations cannot satisfy.
  # go_router has already migrated and pulls it in transitively, so its
  # delegates must be registered in main.dart or any widget of theirs that
  # needs localizations throws at runtime.
  material_ui: ^1.2.0
  cupertino_icons: ^1.0.8
  # Author avatars. Replaces Image.network, which decoded the full
  # source bitmap (Wikipedia photos run to 2000px+) to paint a circle a
  # few dozen pixels wide. Play Console flagged that as a memory issue.
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  go_router: ^18.0.1
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.3-dev.2
  dio: ^5.7.0
  json_annotation: ^4.12.0
  json_serializable: ^6.8.0
  flutter_displaymode: ^0.7.0
  intl: ^0.20.1
  package_info_plus: ^10.1.0
  flutter_dotenv: ^6.0.0
  firebase_analytics: ^12.4.2
  firebase_core: ^4.2.1
  firebase_core_platform_interface: ^8.0.0
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^22.0.0-dev.3
  flutter_native_splash: ^2.4.2
  device_info_plus: ^13.1.0
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2
  drift: ^2.26.0
  drift_flutter: ^0.3.0
  get_it: ^9.1.1
  drift_db_viewer: ^2.1.0
  talker: ^5.1.1
  talker_flutter: ^5.1.1
  talker_dio_logger: ^5.1.1
  talker_riverpod_logger: ^5.1.1
  share_plus: ^13.1.0
  in_app_update: ^5.0.0
  flutter_markdown_plus: ^1.0.3
  # Replaces in_app_purchase, which is still on Play Billing 8.
  # This resolves openiap-google 3.5.1 -> com.android.billingclient:billing 9.1.0.
  flutter_inapp_purchase: ^10.6.1
  async_queue: ^3.0.0
  # Offline library: honour the "Wi-Fi only" toggle before downloading.
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  husky: ^0.1.7
  riverpod_generator: ^4.0.4-dev.3
  build_runner: ^2.4.15
  riverpod_lint: ^3.0.3
  drift_dev: ^2.26.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Only what the app loads at runtime. Build-time icon/splash sources under
  # assets/brand/{master,android,ios,splash,logo} are deliberately not
  # bundled: they are baked into android/ and ios/ by the generators.
  assets:
    - assets/brand/app/
    - assets/legal/
    - assets/data/
    - .env

  # Bundled (not fetched at runtime) so the app looks right offline.
  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/master/quotely-icon-light-square-1024.png"
  remove_alpha_ios: true
  # The paper-and-glow ground as an image, so the adaptive icon matches the
  # iOS and legacy icons exactly.
  adaptive_icon_background: "assets/brand/android/adaptive/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/brand/android/adaptive/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/brand/android/adaptive/ic_launcher_monochrome.png"
  # The brand foreground already keeps the mark inside the 66dp safe zone.
  adaptive_icon_foreground_inset: 0
  # iOS 18 dark and tinted appearances: transparent, glyph only.
  image_path_ios_dark_transparent: "assets/brand/ios/AppIcon-1024-dark.png"
  image_path_ios_tinted_grayscale: "assets/brand/ios/AppIcon-1024-tinted.png"
