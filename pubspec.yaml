name: quotely_flutter_app
description: "A new Flutter project."

publish_to: 'none' 

version: 2.1.1+18

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Direct dependency on purpose. Material/Cupertino are being decoupled from
  # the framework into flutter.dev packages, and material_ui declares its OWN
  # MaterialLocalizations - a different Dart type from the one in
  # package:flutter/material.dart, which flutter_localizations cannot satisfy.
  # motion_toast and go_router have already migrated and pull it in
  # transitively, so its delegates must be registered in main.dart or any
  # widget of theirs that needs localizations throws at runtime.
  material_ui: ^1.2.0
  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.0.2
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.3
  go_router: ^18.0.1
  animate_do: ^5.1.0
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.3-dev.2
  dio: ^5.7.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  skeletonizer: ^3.0.0
  loading_animation_widget: ^1.3.0
  flutter_displaymode: ^0.7.0
  intl: ^0.20.1
  package_info_plus: ^10.1.0
  flutter_dotenv: ^6.0.0
  firebase_analytics: ^12.4.2
  firebase_core: ^4.2.1
  firebase_core_platform_interface: ^8.0.0
  firebase_crashlytics: ^5.0.5
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^22.0.0-dev.3
  flutter_native_splash: ^2.4.2
  device_info_plus: ^13.1.0
  motion_toast: ^2.11.0
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2
  drift: ^2.26.0
  drift_flutter: ^0.3.0
  get_it: ^9.1.1
  hexcolor: ^3.0.1
  drift_db_viewer: ^2.1.0
  talker: ^5.1.1
  talker_flutter: ^5.1.1
  talker_dio_logger: ^5.1.1
  talker_riverpod_logger: ^5.1.1
  share_plus: ^13.1.0
  in_app_update: ^5.0.0
  flutter_markdown_plus: ^1.0.3
  # Replaces in_app_purchase, which is still on Play Billing 8.
  # This resolves openiap-google 3.5.1 -> com.android.billingclient:billing 9.1.0.
  flutter_inapp_purchase: ^10.6.1
  smooth_page_indicator: ^3.0.0
  font_awesome_flutter: ^11.0.0
  async_queue: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  husky: ^0.1.7
  riverpod_generator: ^4.0.4-dev.3
  build_runner: ^2.4.15
  riverpod_lint: ^3.0.3
  drift_dev: ^2.26.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/legal/
    - assets/splash/
    - assets/onboarding/
    - .env
