# Kotlin compiles in its own daemon rather than through the in-process Build
# Tools API, and without incremental caches.
#
# On Gradle 9.7 / AGP 9.4.0 the in-process path (BuildToolsApiCompilationWork)
# fails on Windows with "Could not close incremental caches ... *.tab" for any
# plugin module it compiles - here device_info_plus, firebase_core,
# package_info_plus, in_app_update and in_app_purchase_android. It is NOT stale
# state: deleting build/ and rebuilding reproduces it on the freshly created
# caches, because the failure is the compiler not releasing its own file
# handles and Windows will not let the cache be closed while they are open.
#
# Turning the caches off is what actually fixes it; the daemon strategy alone
# was not enough. Same resolution as snake_classic and the_accountant.
#
# The cost is small: this affects Kotlin only, which here is a handful of
# plugin modules plus MainActivity. All app code is Dart and has its own
# incremental pipeline, untouched by this.
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=false
