org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Added as false by the Flutter migrator. It must stay false for now: with
# it true (tried Oct 2026, Flutter 3.47.7 / AGP 9.4.0), flutter_inapp_purchase
# 10.7.3 fails in :flutter_inapp_purchase:compileDebugKotlin with
# "Unresolved reference 'AndroidInappPurchasePlugin'". The plugin adds its
# src/store/kotlin sources through android.sourceSets.main.java.srcDirs, which
# AGP's built-in Kotlin compilation does not pick up. 11.2.0 and openiap main
# have the same layout. The app module itself is already migrated (no
# kotlin-android plugin, kotlin { compilerOptions } block), so flip this to
# true once that plugin is fixed. The firebase_* plugins already skip KGP
# when it is true.
# See https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Enabled for the Play Console recommendation on release 17. Only has an
# effect alongside isShrinkResources in the release buildType, which is
# why both were turned on together.
android.r8.optimizedResourceShrinking=true

# Kotlin compiles in its own daemon rather than through the in-process Build
# Tools API, and without incremental caches.
#
# On Gradle 9.7 / AGP 9.4.0 the in-process path (BuildToolsApiCompilationWork)
# fails on Windows with "Could not close incremental caches ... *.tab" for any
# plugin module it compiles - here device_info_plus, firebase_core,
# package_info_plus, in_app_update and in_app_purchase_android. It is NOT stale
# state: deleting build/ and rebuilding reproduces it on the freshly created
# caches, because the failure is the compiler not releasing its own file
# handles and Windows will not let the cache be closed while they are open.
#
# Turning the caches off is what actually fixes it; the daemon strategy alone
# was not enough. Same resolution as snake_classic and the_accountant.
#
# The cost is small: this affects Kotlin only, which here is a handful of
# plugin modules plus MainActivity. All app code is Dart and has its own
# incremental pipeline, untouched by this.
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=false
